<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopy Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#262624; --cream:#f5d2aa; --purple:#5a2a8c; --lav:#b48be0; --acid:#c8f526; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream);
    font-family:Quicksand,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  #final{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;pointer-events:none;text-align:center}
  #logo{display:block}
  h1{margin:10px 0 0;line-height:0;opacity:0;color:var(--acid);font-size:0}
  h1 svg{display:block;height:auto;overflow:visible}
  .slogan{margin:10px 0 0;font-weight:500;opacity:0;letter-spacing:.6px;color:rgba(235,225,245,.72)}
  .slogan .h{color:var(--acid)}
  .insta{margin-top:20px;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
    border:1.5px solid rgba(200,245,38,.38);background:rgba(200,245,38,.08);color:rgba(200,245,38,.72);
    text-decoration:none;font-weight:500;font-size:14px;letter-spacing:.3px;opacity:0;transition:background .15s,border-color .15s,color .15s}
  .insta:hover{background:rgba(200,245,38,.18);border-color:rgba(200,245,38,.6);color:var(--acid)}
  .insta svg{width:16px;height:16px}
  #final.ready{pointer-events:auto}
  #final,#menu{transition:opacity .55s ease, transform .55s ease}
  #final.away{opacity:0 !important;transform:scale(.94);pointer-events:none !important}

  /* светящиеся звёздочки в буквах O */
  #logoWrap{position:relative;display:block;will-change:transform,opacity;opacity:0}
  .star{position:absolute;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:0;background:none;
    cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s ease;-webkit-tap-highlight-color:transparent}
  #final.ready .star{opacity:1;pointer-events:auto}
  .star svg{width:100%;height:100%;overflow:visible;display:block;animation:twinkle 1.8s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(255,255,230,1)) drop-shadow(0 0 18px rgba(200,245,38,.9)) drop-shadow(0 0 32px rgba(200,245,38,.5))}
  .star:nth-of-type(2) svg{animation-delay:.9s}
  .star .glint{transform-origin:50% 50%;animation:glint 1.8s ease-in-out infinite}
  .star:nth-of-type(2) .glint{animation-delay:.9s}
  .star:hover svg{animation-duration:.6s;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px var(--acid)) drop-shadow(0 0 40px var(--acid))}
  .star.burst svg{animation:burst .6s ease-out forwards}
  @keyframes twinkle{0%,100%{transform:scale(.75);opacity:.6}50%{transform:scale(1.2);opacity:1}}
  @keyframes glint{0%,60%{opacity:0;transform:rotate(0) scale(.2)}75%{opacity:1;transform:rotate(45deg) scale(1)}100%{opacity:0;transform:rotate(90deg) scale(.2)}}
  @keyframes burst{0%{transform:scale(1)}40%{transform:scale(2.2) rotate(30deg);opacity:1}100%{transform:scale(3.4) rotate(60deg);opacity:0}}
  /* підказка — tap зірочку */
  #starHint{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-size:11px;letter-spacing:.6px;
    color:rgba(200,245,38,.55);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 1s}
  #final.ready #starHint{opacity:1}
  #final.ready.hinted #starHint{opacity:0}

  /* меню */
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:70px 18px 30px;opacity:0;pointer-events:none;transform:scale(1.04);overflow-y:auto}
  #menu.open{opacity:1;pointer-events:auto;transform:none}
  #menu .mtitle{color:var(--acid);width:min(62vw,280px)}
  #menu .mtitle svg{width:100%;height:auto;display:block}
  .cards{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,3.2vh,30px)}
  .card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border:0;background:none;cursor:pointer;
    color:var(--acid);opacity:0;transform:translateY(16px);transition:opacity .5s ease, transform .5s ease, filter .25s}
  #menu.open .card{opacity:1;transform:none}
  #menu.open .card:nth-child(2){transition-delay:.1s,.1s,0s}
  #menu.open .card:nth-child(3){transition-delay:.2s,.2s,0s}
  .card:hover{filter:drop-shadow(0 0 8px rgba(200,245,38,.55))}
  .card:active{transform:scale(.97)}
  .card .ic{width:clamp(48px,7vh,64px);height:clamp(48px,7vh,64px)}
  .card .wd{height:clamp(54px,8.5vh,80px);width:auto;display:block}
  @media (min-width:820px){ .cards{flex-direction:row;gap:70px;align-items:flex-end} .card .ic{width:76px;height:76px} .card .wd{height:92px} }
  .back{position:fixed;left:14px;top:14px;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(200,245,38,.35);
    background:rgba(30,30,28,.6);color:var(--acid);font:600 15px Quicksand,system-ui,sans-serif;cursor:pointer}
  .back:hover{border-color:var(--acid)}
  .view{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;
    transform:scale(1.03);transition:opacity .5s ease, transform .5s ease;padding:76px 16px 130px;
    display:flex;flex-direction:column;align-items:center}
  .view.open{opacity:1;pointer-events:auto;transform:none}
  .view .head{color:var(--acid);height:clamp(64px,10vh,96px);margin-bottom:clamp(14px,3vh,30px)}
  .view .head svg{height:100%;width:auto;display:block}
  .opt{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--acid);transition:transform .25s ease, filter .25s ease;-webkit-tap-highlight-color:transparent}
  .opt:hover{transform:translateY(-3px)}
  .opt.sel{filter:drop-shadow(0 0 10px rgba(200,245,38,.6))}
  .opt .lbl{height:40px;width:auto;opacity:.85}
  .opt.sel .lbl{opacity:1}
  .opt .art{width:clamp(92px,26vw,130px);height:clamp(92px,26vw,130px)}
  .opt .mark{width:7px;height:7px;border-radius:50%;background:var(--acid);opacity:0;transition:opacity .2s}
  .opt.sel .mark{opacity:1}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(18px,4vh,36px) clamp(18px,6vw,60px)}
  @media (min-width:820px){ .grid2{grid-template-columns:repeat(4,1fr)} #character .grid2{grid-template-columns:repeat(3,1fr)}
    .opt .art{width:160px;height:160px} .opt .lbl{height:52px}
    .yarns{grid-template-columns:repeat(auto-fill,100px);gap:16px 14px} .yarn img{width:104px;height:104px} .yarn span{font-size:13px} }
  .yarns{display:grid;grid-template-columns:repeat(auto-fill,72px);justify-content:center;gap:10px 8px;width:min(100%,1000px)}
  .yarn{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    -webkit-tap-highlight-color:transparent;position:relative}
  .yarn img{width:80px;height:80px;display:block;image-rendering:-webkit-optimize-contrast;transition:transform .25s ease, filter .25s ease}
  .yarn:hover img{transform:scale(1.08)}
  .yarn span{font:500 12px Quicksand,system-ui,sans-serif;letter-spacing:.5px;color:rgba(235,225,245,.55);margin-top:-6px}
  .yarn.sel img{transform:scale(1.18);filter:drop-shadow(0 0 6px rgba(200,245,38,.9)) drop-shadow(0 0 16px rgba(200,245,38,.45))}
  .yarn.sel span{color:var(--acid);font-weight:600}
  .yarn .badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;
    background:var(--acid);color:#1c1b1a;font:700 11px/18px Quicksand,sans-serif;
    text-align:center;box-shadow:0 0 8px rgba(200,245,38,.7);pointer-events:none;
    display:flex;align-items:center;justify-content:center}
  /* собранная шапка — внизу экрана */
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:18px;
    padding:26px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transform:translateY(20px);
    transition:opacity .45s ease, transform .45s ease;background:linear-gradient(to top, rgba(38,38,36,.95) 40%, rgba(38,38,36,0));
    max-width:calc(100vw - 84px);overflow-x:auto;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  #bar.show{opacity:1;transform:none}
  #bar.show .slot{pointer-events:auto}
  .slot{border:0;background:none;padding:0;cursor:pointer;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;color:var(--acid);position:relative}
  .slot.empty::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(200,245,38,.35)}
  .slot img{width:58px;height:58px}
  .slot svg{width:46px;height:46px}
  .slot.chars{width:auto;min-width:52px;gap:2px}
  .slot.chars svg{width:40px;height:40px}
  .slot.colors{width:auto;min-width:52px;gap:2px}
  .slot.colors.multi img{width:42px;height:42px}
  .plus{color:rgba(200,245,38,.45);font:500 20px Quicksand,sans-serif}
  /* стрелка «дальше» */
  #next{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;border:0;background:none;
    padding:6px;cursor:pointer;color:var(--acid);opacity:0;pointer-events:none;transform:translateX(-8px);
    transition:opacity .4s ease, transform .4s ease, filter .25s}
  #next.show{opacity:.35;pointer-events:auto;transform:none}
  #next.ready{opacity:1;filter:drop-shadow(0 0 8px rgba(200,245,38,.55));animation:nudge 1.6s ease-in-out infinite}
  #next svg{display:block;width:76px;height:40px;overflow:visible}
  #next.big svg{width:150px;height:44px}
  #next.shake{animation:shake .4s}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (max-width:520px){ #bar{justify-content:flex-start;padding-left:14px;gap:8px} .slot{width:46px;height:46px} .slot img{width:52px;height:52px} .slot svg{width:40px;height:40px} .slot.chars svg{width:32px;height:32px} .slot.colors.multi img{width:34px;height:34px} #next svg{width:64px} #next.big svg{width:96px} }
  /* результат */
  #result .head{height:clamp(56px,9vh,84px)}
  #preview{width:min(86vw,58vh,460px);aspect-ratio:1;display:block}
  .sum{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--acid)}
  .sum img{width:54px;height:54px}
  .sum .num{font:600 14px Quicksand,sans-serif;color:var(--acid);margin-left:-6px}
  .sum .lbl{height:40px;width:auto}
  .sum .dot{color:rgba(200,245,38,.45)}
  #result .result-order{opacity:1;margin-top:16px;background:rgba(200,245,38,.14);border-color:rgba(200,245,38,.5);color:var(--acid);font-size:15px;padding:10px 22px}
  #result .result-order:hover{background:rgba(200,245,38,.25);border-color:var(--acid)}
  .disclaimer{margin:14px auto 0;max-width:340px;font-size:11.5px;line-height:1.55;color:rgba(235,225,245,.38);text-align:center}
  .disclaimer a{color:rgba(200,245,38,.5);text-decoration:none}
  .disclaimer a:hover{color:rgba(200,245,38,.8)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);padding:12px 20px;border-radius:999px;
    background:var(--acid);color:#2a1440;font-weight:600;opacity:0;transition:.35s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #replay{position:fixed;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:none;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .4s}
  #replay.show{opacity:1;pointer-events:auto}
</style>
</head>

      const a = R() * Math.PI * 2, ex = px + Math.cos(a) * rw, ey = py + Math.sin(a) * rh, l = rw * (.12 + R() * .18);
      x.beginPath(); x.moveTo(ex, ey); x.lineTo(ex + Math.cos(a + (R() - .5)) * l, ey + Math.sin(a + (R() - .5)) * l);
      x.strokeStyle = R() < .5 ? lt(.3) : sh(.5); x.lineWidth = .8 + R() * .8; x.stroke();
    }
  }
  // зона з вязаного полотна: rows = горизонтальні ряди (купол), ribs = вертикальні різочки (манжет)
  function knit(g, path, color, cell, rot, bbox, mode) {
    const cols = Array.isArray(color) ? color : [color];
    const pc = document.createElement('canvas'); pc.width = pc.height = 600; const x = pc.getContext('2d');
    x.save(); x.clip(path);
    x.fillStyle = mix(cols[0], '#000000', .7); x.fillRect(0, 0, 600, 600);
    x.translate(300, 300); x.rotate(rot || 0); x.translate(-300, -300);
    const getCol = py => cols[((Math.floor(py / 36) % cols.length) + cols.length) % cols.length];
    if (mode === 'ribs') {
      // манжет: колонки, парні колонки вищі й світліші (лицьова), непарні коротші й тьмяніші (виворітна)
      for (let c = -2; c * cell < 700; c++) {
        const px = c * cell + cell / 2;
        const up = (c & 1) === 0;
        for (let r = -1; r * cell * 1.1 < 700; r++) {
          const py = r * cell * 1.1 + (up ? 0 : cell * .55);
          const ccol = getCol(py);
          stitch(x, px, py, cell * .56, cell * (up ? .7 : .5), up ? ccol : mix(ccol, '#000000', .18), up ? 1 : .8);
        }
      }
    } else if (mode === 'loops') {
      // петлі Alize Puffy: горизонтальні «сосиски», ряди нахльостуються згори вниз
      const rs = cell * .62, cs = cell * 1.3;
      for (let r = -2; r * rs < 760; r++) for (let c = -2; c * cs < 760; c++) {
        const px = c * cs + (r & 1 ? cs / 2 : 0) + cs / 2, py = r * rs;
        // матова пряжа: тінь-складка між рядами, блік майже відсутній
        const ccol = getCol(py);
        stitch(x, px, py, cs * .58, rs * 1.05, ccol, .6, true);
      }
    } else {
      // купол: зсунуті ряди круглих петель
      const sx = cell * 1.0, sy = cell * .74;
      for (let r = -1; r * sy < 700; r++) for (let c = -1; c * sx < 700; c++) {
        const px = c * sx + (r & 1 ? sx / 2 : 0) + sx / 2, py = r * sy + sy / 2;
        const jx = ((r * 37 + c * 91) % 7 - 3) * cell * .02, jy = ((r * 53 + c * 29) % 5 - 2) * cell * .02;
        const ccol = getCol(py + jy);
        stitch(x, px + jx, py + jy, cell * .6, cell * .46, ccol, 1);
      }
    }
    x.restore();
    x.globalCompositeOperation = 'source-atop';
    const [bx, by, bw, bh] = bbox;
    const gr = x.createRadialGradient(bx + bw * .32, by + bh * .22, 4, bx + bw * .5, by + bh * .5, Math.max(bw, bh) * .75);
    gr.addColorStop(0, 'rgba(255,255,255,.08)'); gr.addColorStop(.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
    x.fillStyle = gr; x.fillRect(0, 0, 600, 600);
    x.globalCompositeOperation = 'source-over';
    g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 22; g.shadowOffsetY = 10; g.drawImage(pc, 0, 0); g.restore();
  }
  const P = d => new Path2D(d);
  const ellipse = (cx, cy, rx, ry, rot) => { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, rot || 0, 0, Math.PI * 2); return p; };
  function drawPiece(g, color, form, chars) {
    const cols = Array.isArray(color) ? color : [color];
    const main = cols[0];
    const alt = cols.length > 1 ? cols[1] : null;
    // Alize Puffy puff size: big chunky cells match the real yarn's loops
    const C = 28;  // main cell size
    const tops = { hat: 145, balaclava: 128, kerchief: 148, scarf: 190 };
    const T = tops[form], cx = 300;
    const light = alt ? mix(alt, '#ffffff', .25) : mix(main, '#ffffff', .4);
    const dark = alt ? mix(alt, '#000000', .25) : mix(main, '#141414', .55);
    const has = id => chars.includes(id);
    // уші/вуха — за головою
    if (has('bunny')) {
      [[-1, -.14], [1, .14]].forEach(([s, r]) => {
        knit(g, ellipse(cx + s * 60, T - 96, 38, 128, r), cols, C, r, [cx + s * 60 - 38, T - 224, 76, 256]);
        knit(g, ellipse(cx + s * 60, T - 84, 16, 95, r), light, 14, r, [cx + s * 60 - 16, T - 179, 32, 190]);
      });
    }
    if (has('kitty')) {
      [-1, 1].forEach(s => {
        knit(g, P(`M${cx + s*152} ${T+88}L${cx + s*130} ${T-72}L${cx + s*28} ${T+28}Z`), cols, C, 0, [cx-155, T-72, 310, 165]);
        knit(g, P(`M${cx + s*130} ${T+60}L${cx + s*122} ${T-32}L${cx + s*64} ${T+28}Z`), light, 14, 0, [cx-132, T-32, 264, 92]);
      });
    }
    if (has('bear')) [-1, 1].forEach(s => {
      knit(g, ellipse(cx + s*124, T+14, 56, 56), cols, C, 0, [cx + s*124-56, T-42, 112, 112]);
      knit(g, ellipse(cx + s*124, T+18, 28, 28), light, 14, 0, [cx + s*124-28, T-10, 56, 56]);
    });
    if (has('mouse')) [-1, 1].forEach(s => {
      knit(g, ellipse(cx + s*142, T-8, 84, 84), cols, C, 0, [cx + s*142-84, T-92, 168, 168]);
      knit(g, ellipse(cx + s*142, T+2, 50, 50), light, 16, 0, [cx + s*142-50, T-48, 100, 100]);
    });
    if (has('cow')) [-1, 1].forEach(s => {
      const d = `M${cx + s*82} ${T+38}C${cx + s*182} ${T+34} ${cx + s*230} ${T-32} ${cx + s*210} ${T-114}C${cx + s*184} ${T-60} ${cx + s*142} ${T-28} ${cx + s*72} ${T-6}Z`;
      knit(g, P(d), dark, 18, s * .9, [cx-232, T-114, 464, 158]);
    });
    // форма
    if (form === 'hat') {
      // Rounded beanie body — wider at bottom, nicely curved dome
      knit(g, P(`M142 ${T+268}C140 ${T+100} 206 ${T-2} 300 ${T}C394 ${T-2} 460 ${T+100} 458 ${T+268}Z`), cols, C, 0, [142, T-2, 316, 270]);
      // Ribbed band at bottom — wider and more prominent
      const band = new Path2D(); band.roundRect(122, T+235, 356, 100, 48);
      knit(g, band, cols, 20, 0, [122, T+235, 356, 100], 'ribs');
    }
    if (form === 'balaclava') {
      const head = P(`M170 560C138 430 146 ${T + 10} 300 ${T}C454 ${T + 10} 462 430 430 560Z`);
      knit(g, head, cols, 30, 0, [140, T, 320, 430], 'loops');
      const rim = new Path2D(); rim.roundRect(196, 262, 208, 104, 52); rim.roundRect(214, 280, 172, 68, 34);
      knit(g, new Path2D(rim), cols, 22, 0, [196, 262, 208, 104], 'loops');
      const hole = new Path2D(); hole.roundRect(214, 280, 172, 68, 34);
      g.save(); g.fillStyle = '#1c1b1a'; g.fill(hole);
      const ig = g.createLinearGradient(0, 280, 0, 348); ig.addColorStop(0, 'rgba(0,0,0,.6)'); ig.addColorStop(1, 'rgba(60,50,45,.25)');
      g.fillStyle = ig; g.fill(hole); g.restore();
      const neck = new Path2D(); neck.roundRect(176, 470, 248, 92, 30);
      knit(g, neck, cols, 26, 0, [176, 470, 248, 92], 'loops');
    }
    if (form === 'kerchief') {
      [-1, 1].forEach(s => {
        const tie = P(`M${300 + s * 186} ${T + 54}C${300 + s * 216} ${T + 130} ${300 + s * 200} ${T + 240} ${300 + s * 228} ${T + 330}L${300 + s * 206} ${T + 336}C${300 + s * 180} ${T + 246} ${300 + s * 196} ${T + 140} ${300 + s * 168} ${T + 66}Z`);
        knit(g, tie, cols, 16, s * .2, [300 + Math.min(s * 230, s * 160), T + 54, 70, 290]);
      });
      const tri = document.createElement('canvas'); tri.width = tri.height = 600; const tx = tri.getContext('2d');
      knit(tx, P(`M104 ${T + 60}C170 ${T - 30} 430 ${T - 30} 496 ${T + 60}L300 ${T + 380}Z`), cols, 22, 0, [104, T - 10, 392, 390]);
      tx.globalCompositeOperation = 'destination-out';
      for (let r = 0; r < 6; r++) for (let k = 0; k <= 5 - r; k++) {
        const y = T + 60 + r * 46, x = 300 - (5 - r) * 26 + k * 52;
        tx.beginPath(); tx.ellipse(x, y, 13, 11, 0, 0, Math.PI * 2); tx.fill();
      }
      g.drawImage(tri, 0, 0);
    }
    if (form === 'scarf') {
      knit(g, P('M120 230C200 176 400 176 480 230L470 330C390 280 210 280 130 330Z'), cols, C, Math.PI / 2, [120, 180, 360, 150]);
      knit(g, P('M318 292L384 300L404 520L336 530Z'), cols, 22, 0, [318, 292, 86, 238]);
      g.save(); g.lineWidth = 6; g.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        g.strokeStyle = cols[i % cols.length];
        g.beginPath(); g.moveTo(340 + i * 10, 528 - i * 1.4); g.lineTo(338 + i * 11, 572 - i); g.stroke();
      }
      g.restore();
    }
    // жабьи глазки — спереди
    if (has('frog')) [-1, 1].forEach(s => {
      const ex = cx + s * 82, ey = T + 16;
      knit(g, ellipse(ex, ey, 58, 58), cols, 20, 0, [ex - 58, ey - 58, 116, 116]);
      g.save();
      g.fillStyle = '#efecf4'; g.beginPath(); g.ellipse(ex, ey + 4, 34, 32, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#c9b6f0'; g.beginPath(); g.ellipse(ex, ey + 6, 24, 22, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#2a1e3a'; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(ex - 13, ey + 6); g.lineTo(ex + 13, ey + 6); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(ex - 10, ey - 8, 5, 0, Math.PI * 2); g.fill();
      g.restore();
    });
  }
  function showResult() {
    const selYarns = pick.colors.map(n => YARNS.find(v => v.n === n)).filter(Boolean);
    const f = pick.form;
    if (!selYarns.length || !f) return;
    document.getElementById('resHead').innerHTML = LBL[cap(f)].replace('class="lbl"', 'class="hw"');
    const chars = pick.chars.filter(c => c !== 'none');
    const yarnParts = selYarns.map(y => `<img alt="" src="data:image/webp;base64,${y.img}"><span class="num">${y.n}</span>`);
    const charParts = chars.map(c => LBL[cap(c)]);
    document.getElementById('resSum').innerHTML = yarnParts.concat(charParts).join('<span class="dot">+</span>');
    const off = document.createElement('canvas'); off.width = off.height = 600;
    drawPiece(off.getContext('2d'), selYarns.map(y => y.c), f, chars);
    const dpr = Math.min(2, devicePixelRatio || 1), sz = pv.clientWidth || 400;
    pv.width = pv.height = Math.round(sz * dpr);
    const k = pv.width / 600;
    cancelAnimationFrame(pvAnim);
    const t0 = performance.now(), DUR = 1500;
    const step = now => {
      const p = Math.min(1, (now - t0) / DUR), e = 1 - Math.pow(1 - p, 2);
      pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, pv.width, pv.height);
      pctx.setTransform(k, 0, 0, k, 0, 0);
      // довязывается снизу вверх, ряд за рядом
      const rowH = 18, top = 600 - Math.ceil((e * 600) / rowH) * rowH;
      pctx.save(); pctx.beginPath(); pctx.rect(0, top, 600, 600); pctx.clip(); pctx.drawImage(off, 0, 0); pctx.restore();
      if (p < 1) {
        pctx.fillStyle = 'rgba(200,245,38,.9)'; pctx.shadowColor = '#c8f526'; pctx.shadowBlur = 12;
        pctx.fillRect(60, top - 1.5, 480, 3); pctx.shadowBlur = 0;
        pvAnim = requestAnimationFrame(step);
      }
    };
    pvAnim = requestAnimationFrame(step);
  }

  // ---------- меню ----------
  const VIEWS = ['menu', 'color', 'form', 'character', 'result'];
  const bar = document.getElementById('bar');
  function route() {
    const v = location.hash.slice(1);
    const on = VIEWS.includes(v) ? v : null;
    VIEWS.forEach(k => { const el = document.getElementById(k); el.classList.toggle('open', k === on); el.setAttribute('aria-hidden', k === on ? 'false' : 'true'); });
    finalEl.classList.toggle('away', !!on);
    bar.classList.toggle('show', !!on);
    replay.style.visibility = on ? 'hidden' : '';
    if (!on) document.querySelectorAll('.star').forEach(s => s.classList.remove('burst'));
    if (on && on !== 'menu') document.getElementById(on).scrollTop = 0;
    current = on; updateNext();
    if (on === 'result') showResult();
  }
  // ---------- стрелка «дальше» из петелек ----------
  var current = null;
  function loopArrow(n, w) {
    const pitch = (w - 26) / (n + 0.6), r = pitch / (2 * Math.PI), pts = [];
    for (let i = 0; i <= n * 40; i++) {
      const t = 2 * Math.PI * i / 40;
      pts.push([4 + r * t - 0.33 * pitch * Math.sin(t), 22 - 0.36 * pitch * Math.cos(t) + 0.36 * pitch]);
    }
    const last = pts[pts.length - 1], ex = w - 4;
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + `L${ex} ${last[1].toFixed(1)}M${ex - 12} ${(last[1] - 10).toFixed(1)}L${ex} ${last[1].toFixed(1)}L${ex - 12} ${(last[1] + 10).toFixed(1)}`;
    return `<svg viewBox="0 0 ${w} 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  }
  var ARROW1 = loopArrow(1, 76), ARROW3 = loopArrow(3, 150);
  var nextBtn = document.getElementById('next');
  var FLOW = { menu: 'color', color: 'form', form: 'character', character: 'result' };
  function updateNext() {
    if (!nextBtn || !FLOW) return;
    const to = FLOW[current];
    nextBtn.classList.toggle('show', !!to);
    nextBtn.classList.toggle('big', current === 'character');
    nextBtn.innerHTML = current === 'character' ? ARROW3 : ARROW1;
    const ok = current === 'menu' || (current === 'color' && pick.colors.length > 0) || (current === 'form' && pick.form) || current === 'character';
    nextBtn.classList.toggle('ready', !!(to && ok));
  }
  nextBtn.addEventListener('click', () => {
    const to = FLOW[current]; if (!to) return;
    if (!nextBtn.classList.contains('ready')) { nextBtn.classList.remove('shake'); void nextBtn.offsetWidth; nextBtn.classList.add('shake'); return; }
    if (to === 'result' && (!pick.colors || !pick.colors.length)) return go('color');
    if (to === 'result' && !pick.form) return go('form');
    go(to);
  });

  const go = v => { location.hash = v; };
  document.querySelectorAll('.star').forEach(st => st.addEventListener('click', e => {
    e.stopPropagation(); st.classList.add('burst'); finalEl.classList.add('hinted'); setTimeout(() => go('menu'), 380);
  }));
  document.getElementById('back').addEventListener('click', () => go(''));
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => go(b.dataset.back)));
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  addEventListener('hashchange', route);
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#replay') && !e.target.closest('a') && !e.target.closest('.view') && !e.target.closest('#menu') && !e.target.closest('#bar') && !e.target.closest('.star')) skip(); });
  replay.addEventListener('click', () => play(false));
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const d = finished; layout(); play(d); }, 150); });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  Promise.all([
    document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 700))]) : 0,
    logo.decode ? logo.decode().catch(() => {}) : 0
  ]).then(() => { layout(); const m = VIEWS.includes(location.hash.slice(1)); play(reduce || m); route(); });
})();
